version: '3.8'

services:
  # 1. 宿主机指标采集探针（标准桥接网络模式）
  node-exporter:
    image: prom/node-exporter:latest
    container_name: mon_node_exporter
    restart: always
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'

  # 2. Prometheus 监控时序数据库
  prometheus:
    image: prom/prometheus:latest
    container_name: mon_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - alertmanager

  # 3. Alertmanager 告警分发中枢
  alertmanager:
    image: prom/alertmanager:latest
    container_name: mon_alertmanager
    restart: always
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'

  # 4. Grafana 可视化监控大盘
  grafana:
    image: grafana/grafana:latest
    container_name: mon_grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

  # 5. Nginx 安全反向代理统一网关
  nginx:
    image: nginx:alpine
    container_name: mon_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "9443:9443"
      - "9444:9444"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - grafana
      - prometheus
      - alertmanager
