global:
  scrape_interval: 5s     # 每 5 秒采集一次数据
  evaluation_interval: 5s # 每 5 秒评估一次告警规则

# 关联告警中心 Alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# 加载告警规则文件
rule_files:
  - "alert.rules.yml"

# 采集任务定义
scrape_configs:
  - job_name: 'openeuler-host'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: 'openEuler-24.03-LTS'
